<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="lF4WcYzE0l77iwEG3dQtzl">
<head data-page-node-id="yGfRG58Y4QrAYIVR0FffaX">

<title>JSON &amp; SQL 可视化工具</title>
<link rel="stylesheet" href="cm/codemirror.min.css" data-page-node-id="5ZMLIAsfczhcg6GljgV404">
<link rel="stylesheet" href="cm/foldgutter.min.css" data-page-node-id="9rf3sDJggjO6U7xQuEEbhB">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2328;
    --muted: #6e7781;
    --punc: #57606a;
    --key: #0a6cce;
    --string: #1a7f37;
    --number: #b55300;
    --boolean: #8250df;
    --null: #8b949e;
    --error-bg: #fff1f0;
    --error-border: #ffccc7;
    --error-text: #cf1322;
    --accent: #2f6feb;
    /* graph（结构图）专用：比通用 --border 深一档，保证框/网格在浅底上能分清 */
    --g-canvas: #f8fbfd;
    --g-canvas-line: #e6eef5;
    --g-node-border: #c3d4e3;
    --g-head-bg: #e7eff5;
    --g-head-border: #cbdae8;
    --g-line: #dce6ef;
    --g-zebra: #f8fbfd;
    --g-side-bg: #eff5fb;
    --g-edge: #a9c2d6;
    --g-edge-label: #5b6b7a;
    --g-hover-border: #6f9ec2;
    --g-row-hover: #e8f2fa;
    /* 文字色：默认同色（中性），换配色表时按类型着色 */
    --g-title: #a31515;
    --g-key: #a31515;
    --g-val: #1f2328;
    --g-idx: #a31515;
    --g-num: #098658;
    --g-str: #0451a5;
    --g-bool: #8250df;
    --g-null: #6e7781;
    --code-font: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--ui-font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  header h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  header .btn { padding: 4px 11px; }
  header .spacer { flex: 1; }
  .btn {
    font: inherit; font-size: 13px; padding: 6px 12px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 7px; cursor: pointer; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.tiny { font-size: 12px; padding: 4px 10px; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane { min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
  .pane.left { border-right: 1px solid var(--border); flex: 0 0 28.57%; }
  .pane.right { position: relative; flex: 1 1 auto; --tree-font: 13px; }

  /* vertical splitter (left / right) */
  .splitter {
    flex: 0 0 7px; cursor: col-resize; background: var(--bg);
    position: relative; z-index: 6;
  }
  .splitter::after {
    content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 3px;
    background: var(--border); border-radius: 3px;
  }
  .splitter:hover::after, .splitter.active::after { background: var(--accent); }

  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border); background: #fafbfc; flex-wrap: nowrap;
  }
  .pane-head .ph-label { white-space: nowrap; }
  .pane-head .badge {
    margin-left: auto; font-weight: 500; font-size: 11.5px; padding: 2px 8px;
    border-radius: 20px; background: #eef1f5; color: var(--muted);
  }
  .pane-head .badge.ok { background: #e6f6ec; color: #1a7f37; }
  .pane-head .badge.err { background: var(--error-bg); color: var(--error-text); }
  .pane-head .hint { font-weight: 400; font-size: 11px; color: #9aa3ad; }
  .cmd-select {
    font: inherit; font-size: 12.5px; padding: 4px 8px; margin-left: 8px;
    border: 1px solid var(--border); border-radius: 7px; background: #fff; color: var(--text);
    cursor: pointer;
  }
  .cmd-select:hover { border-color: var(--accent); }
  .cmd-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,111,235,.12); }

  /* merged toolbar: 结构视图 + 模式 + 转义/导航 + 缩放 + 搜索 全部在一行 */
  .tool-spacer { margin-left: auto; }
  .search-box { display: flex; align-items: center; gap: 6px; }
  .search-box.hidden { display: none; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border: 1px solid var(--border);
    background: #fff; color: var(--muted); border-radius: 7px; cursor: pointer;
    transition: all .15s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { display: block; }
  .mode-toggle { display: inline-flex; gap: 4px; margin-left: 8px; }
  .icon-btn.active { border-color: var(--accent); color: var(--accent); background: #eef4ff; }

  /* relationship graph view */
  .graph-view {
    flex: 1 1 auto; min-height: 0; display: none; overflow: hidden; position: relative; cursor: grab; touch-action: none;
    background: var(--g-canvas); background-image:
      linear-gradient(var(--g-canvas-line) 1px, transparent 1px), linear-gradient(90deg, var(--g-canvas-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .pane.right.mode-graph .output { display: none; }
  .pane.right.mode-graph .graph-view { display: block; }
  .graph-view svg { display: block; }

  /* 节点框：对齐「列表模式」的表格样式（中性灰白配色，去掉类型彩色）
     外框 / 表头 / 内部网格线用三档深浅拉开层次，保证在浅色画布上分得清 */
  .gnode { cursor: grab; }
  .gnode:active { cursor: grabbing; }
  .gnode-rect { fill: #fff; }
  /* 边框覆盖层：在节点全部内容之后最后绘制——竖表头浅底/斑马纹/hover 行等底色
     不再盖住框线（此前底色贴边绘制会吃掉描边的内侧一半，框线看着粗细不一） */
  .gnode-border { fill: none; stroke: var(--g-node-border); stroke-width: 1.3; pointer-events: none; }
  .gnode-head { stroke: var(--g-head-border); stroke-width: 1; fill: var(--g-head-bg); }
  .gnode-title { font: 600 12px var(--ui-font); fill: var(--g-title); user-select: none; pointer-events: none; }
  .gnode-key { font: 600 11px var(--ui-font); fill: var(--g-key); user-select: none; pointer-events: none; }
  .gnode-val { font: 11px var(--code-font); fill: var(--g-val); user-select: none; pointer-events: none; }
  /* 数组合并框的竖表头（元素下标 [i]）与「另 N 项」溢出行 */
  .gnode-idx { font: 600 10.5px var(--ui-font); fill: var(--g-idx); user-select: none; pointer-events: none; }
  .gnode-val.more { fill: var(--g-idx); font-style: italic; }
  .gnode-key.more { fill: var(--g-idx); font-style: italic; font-weight: 400; }
  .grow-div { stroke: var(--g-line); stroke-width: 1; }
  .grow-div.col { stroke: var(--g-line); }
  /* 竖表头列 / 根节点键列的浅底：强调「横表头 + 竖表头」的表格结构 */
  .gnode-side { fill: var(--g-side-bg); pointer-events: none; }
  /* 行命中层：透明矩形只负责接收鼠标事件，且画在文字「下方」，
     悬停高亮不会盖住这一行的字段名 / 值（文字统一 pointer-events:none 让事件穿透到本层） */
  .gnode-row { fill: #fff; fill-opacity: 0; pointer-events: all; }
  .gnode-row.clickable { cursor: grab; }
  .gnode-row.clickable:hover { fill: var(--g-row-hover); fill-opacity: 1; }
  /* 当前选中的字段行 / 数组元素行：强调色底（与 hover 的中性色区分） */
  .gnode-row.hl-row { fill: rgba(47, 111, 235, .16); fill-opacity: 1; }
  /* 单元格级高亮覆盖层（对象行值单元格 / 数组行命中列），由 JS 按 Node 几何动态插入 */
  .cell-hl { fill: rgba(47, 111, 235, .16); pointer-events: none; }
  /* 根节点纵向表格的偶数行底色（对齐 table.jtable tbody tr:nth-child(even)） */
  .gnode-zebra { fill: var(--g-zebra); pointer-events: none; }
  /* 数组/对象字段行：值列显示长度标识 [N] / {N}（中性色，不强调） */
  .gnode-val.arr { font: 600 11px var(--code-font); fill: var(--g-val); }
  .gnode-val.obj { font: 600 11px var(--code-font); fill: var(--g-val); }
  /* 按值类型着色（默认与普通值同色，切配色表时才拉开） */
  .gnode-val.t-num { fill: var(--g-num); }
  .gnode-val.t-str { fill: var(--g-str); }
  .gnode-val.t-bool { fill: var(--g-bool); }
  .gnode-val.t-null { fill: var(--g-null); }
  .gnode .gnode-border { transition: stroke-width .12s, stroke .12s; }
  .gnode:hover .gnode-border { stroke-width: 1.8; stroke: var(--g-hover-border); }
  /* 选中节点突出显示：加粗描边 + 蓝色光晕（drop-shadow 在 SVG 上各方向泛光） */
  .gnode.selected .gnode-border { stroke-width: 2.6; stroke: var(--accent); filter: drop-shadow(0 0 3px rgba(47, 111, 235, .6)); }
  .gedge { stroke: var(--g-edge); stroke-width: 1.5; fill: none; }
  .gedge.seq { stroke: #788497; stroke-width: 1.3; stroke-dasharray: 5 3; }
  .gedge-label { font: 10px var(--ui-font); fill: var(--g-edge-label); }
  .gedge-label-bg { fill: var(--g-canvas); }
  .gcollapse { cursor: pointer; }
  .gcollapse circle { fill: #fff; stroke: #0a6cce; stroke-width: 1.4; transition: fill .12s, stroke .12s; }
  .gcollapse:hover circle { fill: #eaf2fc; }
  .gcollapse.closed circle { fill: #fff3e8; stroke: #e8590c; }
  .gcollapse text { font: 700 11px var(--ui-font); fill: #0a6cce; user-select: none; }
  .gcollapse.closed text { fill: #e8590c; }
  /* 值高亮（markText，仅字段值、不含键名）：颜色对齐浏览器文本选中的高亮色 */
  .cm-graph-hl { background: #b3d4fc !important; border-radius: 2px; }
  /* 整行高亮（addLineClass 到 background）：覆盖行首缩进、行尾空白与整行行高，即「行的间距部分」 */
  .cm-graph-hl-line { background: #b3d4fc !important; }
  .search-box input {
    font: inherit; font-size: 12.5px; padding: 5px 10px; width: 184px;
    border: 1px solid var(--border); border-radius: 7px; background: #fff; color: var(--text);
  }
  .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,111,235,.12); }
  .search-count { font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }
  .search-hit { background: #fff2a8 !important; border-radius: 3px; box-shadow: 0 0 0 1px #f0d35a; }

  /* editor (CodeMirror) */
  .editor-host { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #editor { height: 100%; }
  .CodeMirror {
    height: 100%; font-family: var(--code-font); font-size: 13px; line-height: 1.6;
    border: none;
  }
  .CodeMirror-gutters { background: #fafbfc; border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: #b3bac3; }

  /* bigger fold / collapse icons */
  .CodeMirror-foldgutter { width: 22px; }
  .CodeMirror-foldgutter-open:after,
  .CodeMirror-foldgutter-folded:after {
    font-size: 16px !important;
    line-height: 1.7 !important;
    font-weight: 700;
  }
  .CodeMirror-foldgutter-open:after { color: var(--muted); }
  .CodeMirror-foldgutter-folded:after { color: var(--accent); }

  .cm-error { background: #ffd9d6 !important; color: var(--error-text) !important; border-radius: 2px; box-shadow: 0 0 0 1px #ffaaa3; }
  .cm-string { color: var(--string); }
  .cm-number { color: var(--number); }
  .cm-atom { color: var(--boolean); }
  .cm-property { color: var(--key); }
  .cm-null { color: var(--null); }
  .cm-keyword { color: #8250df; font-weight: 600; }
  .cm-operator, .cm-punctuation { color: var(--punc); }
  .cm-comment { color: var(--muted); font-style: italic; }
  .cm-variable-2 { color: #0a6cce; }

  /* error box */
  .err-box {
    display: none; flex: 0 0 auto; margin: 0; padding: 10px 14px;
    background: var(--error-bg); border-top: 1px solid var(--error-border);
    color: var(--error-text); font-size: 12.5px; font-family: var(--code-font);
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .err-box.show { display: block; }

  /* output (tree) */
  .output {
    flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px 16px;
    cursor: grab; font-size: var(--tree-font);
  }
  .output:active { cursor: grabbing; }
  .output.dragging { user-select: none; cursor: grabbing; }
  .placeholder { color: var(--muted); font-size: 13px; padding: 20px 4px; }
  .root-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .root-label .type-badge {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    background: #eef1f5; color: var(--accent); font-weight: 600; margin-right: 6px;
  }

  /* tree */
  .branch { margin: 1px 0; }
  .branch-head {
    display: flex; align-items: flex-start; gap: 4px; cursor: pointer;
    padding: 1px 0; border-radius: 4px; user-select: none;
  }
  .branch-head:hover { background: #f3f5f8; }
  .toggle {
    flex: 0 0 auto; width: 14px; text-align: center; color: var(--muted);
    font-size: 11px; line-height: 1.6; transition: transform .12s ease;
  }
  .branch.collapsed .toggle { transform: rotate(-90deg); }
  .branch-header { font-family: var(--code-font); font-size: var(--tree-font); line-height: 1.6; }
  .branch-children { margin-left: 6px; padding-left: 14px; border-left: 1px dashed #dfe3e8; }
  .branch.collapsed > .branch-children { display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; font-family: var(--code-font); font-size: var(--tree-font); line-height: 1.6; padding: 1px 0; }
  .key { color: var(--key); }
  .punc { color: var(--punc); }
  .count { color: var(--muted); font-style: italic; }
  .leaf { font-family: var(--code-font); font-size: var(--tree-font); }
  .leaf.string { color: var(--string); white-space: pre-wrap; }
  .leaf.number { color: var(--number); }
  .leaf.boolean { color: var(--boolean); }
  .leaf.null { color: var(--null); }
  .nav-btn {
    margin-left: auto; flex: 0 0 auto; border: 1px solid var(--border); background: #fff;
    color: var(--muted); border-radius: 5px; font-size: 11px; line-height: 1; padding: 2px 5px; cursor: pointer;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* table */
  .table-wrap { margin: 4px 0; }
  .table-label { font-family: var(--code-font); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  table.jtable {
    border-collapse: collapse; font-family: var(--code-font); font-size: var(--tree-font);
    background: #fff;
  }
  table.jtable th, table.jtable td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top;
    white-space: nowrap;
  }
  table.jtable th { background: #f3f5f8; color: var(--text); font-weight: 600; position: sticky; top: 0; }
  table.jtable tbody tr:nth-child(even) { background: #fafbfc; }
  table.jtable tbody tr:hover { background: #eef3fb; }
  table.jtable td.idx { text-align: center; color: var(--muted); background: #fafbfc; }

  /* ---------- minimap / viewport-nav（悬浮于画布右上，独立于「当前元素」面板） ---------- */
  .map-win {
    position: absolute; top: 100px; right: 12px; width: 190px; z-index: 30;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(20,30,50,.16); font-size: 12px; overflow: hidden;
  }
  .map-win.hidden { display: none; }
  .map-body { padding: 8px; }
  /* 缩略图：长方形（宽 > 高），无标题栏 / 无视图信息行（信息在 title 悬浮提示里） */
  .map-mini {
    position: relative; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #e9edf2;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: grab;
  }
  .map-thumb {
    position: absolute; left: 4px; right: 4px; top: 0; height: 40px;
    background: rgba(47,111,235,.16); border: 1.5px solid var(--accent); border-radius: 3px;
    cursor: grab;
  }
  .map-thumb:active { cursor: grabbing; background: rgba(47,111,235,.34); }

  /* ---------- bottom selection (drill-down) panel ---------- */
  .sel-panel {
    flex: 0 0 auto; height: 320px; display: flex; flex-direction: column; min-height: 0;
    border-top: 1px solid var(--border); background: #fff;
  }
  .sel-panel.hidden { display: none; }
  .hidden { display: none !important; }
  .sel-resize { height: 6px; cursor: ns-resize; background: #eef1f5; flex: 0 0 auto; }
  .sel-resize:hover { background: #dde3ec; }
  /* 面板头：标题 + 当前路径 + 前进/后退 + 收起/关闭 */
  .sel-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 30px;
    padding: 0 8px 0 10px; border-bottom: 1px solid var(--border); background: #f7f9fc;
  }
  .sel-head-title { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .sel-head-path {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--code-font); font-size: 11.5px; color: var(--accent);
  }
  .sel-head-actions { flex: 0 0 auto; display: flex; gap: 4px; }
  /* 「–」收起：面板只剩标题栏一行 */
  .sel-panel.min .sel-body, .sel-panel.min .sel-resize { display: none; }
  .sel-panel.min { height: 30px !important; min-height: 0; }
  .sel-title { font-weight: 600; color: var(--text); }
  .col-path {
    font-family: var(--code-font); font-size: 11px; color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 6px;
  }
  .sel-body { flex: 1 1 auto; display: flex; min-height: 0; }
  /* 多级下钻列容器：列数不限，超出宽度时横向滚动 */
  .sel-cols { flex: 1 1 auto; min-width: 0; display: flex; overflow-x: auto; }
  /* 正常列宽 = 除「最终值」外宽度的 1/3；数组元素列（[0] [1]…）= 1/2，即整体的 1/6 */
  .sel-col { display: flex; flex-direction: column; min-height: 0; flex: 0 0 auto; width: calc(100% / 3); min-width: 96px; border-right: 1px solid var(--border); background: #fff; }
  .sel-col.arr-col { width: calc(100% / 6); min-width: 60px; }
  .sel-col-title { flex: 0 0 auto; font-size: 11px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); background: #fafbfc; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
  .sel-col-scroll { flex: 1 1 auto; overflow: auto; padding: 7px; }
  .sel-splitter { flex: 0 0 7px; cursor: col-resize; background: #eef1f5; position: relative; }
  .sel-splitter::after {
    content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 3px;
    background: var(--border); border-radius: 3px;
  }
  .sel-splitter:hover::after { background: var(--accent); }
  /* nav 行：对齐 treease 底部结构选择的「名称 + 类型角标 + 展开箭头」行样式 */
  .nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: none; border-bottom: 1px solid #f0f2f5; border-radius: 0; background: transparent;
    padding: 6px 8px; font: inherit; font-family: var(--code-font); font-size: 12.5px;
    cursor: pointer; color: var(--text);

    const hh = String(d.getHours()).padStart(2, "0");

  /* ---------- MySQL syntax highlighting (lightweight CodeMirror mode) ---------- */
  (function () {
    if (CodeMirror.modes && CodeMirror.modes.mysql) return;
    const keywords = ("SELECT FROM WHERE ORDER BY GROUP HAVING JOIN LEFT RIGHT INNER OUTER FULL " +
      "ON AS AND OR NOT IN IS NULL TRUE FALSE LIKE BETWEEN EXISTS CASE WHEN THEN ELSE END " +
      "UNION ALL DISTINCT LIMIT OFFSET INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE " +
      "DROP ALTER INDEX PRIMARY KEY FOREIGN REFERENCES VIEW TRIGGER PROCEDURE FUNCTION DATABASE " +
      "SHOW DESCRIBE EXPLAIN USE IF WITH RECURSIVE OVER PARTITION ROWS RANGE UNBOUNDED PRECEDING " +
      "FOLLOWING CURRENT INTERVAL DESC ASC").split(/\s+/);
    const kwSet = {};
    keywords.forEach(function (k) { kwSet[k.toUpperCase()] = true; });
    const ops = "=<>!+-*/%&|^~?:,.;";
    CodeMirror.defineMode("mysql", function () {
      return {
        startState: function () { return {}; },
        token: function (stream) {
          if (stream.eatSpace()) return null;
          const ch = stream.peek();
          // comments
          if (ch === "-" && stream.match(/^--/)) { stream.skipToEnd(); return "comment"; }
          if (ch === "/" && stream.match(/^\/\*/)) { stream.skipToEnd(); return "comment"; }
          // strings
          if (ch === "'" || ch === '"') { stream.next(); let escaped = false; while (!stream.eol()) { const c = stream.next(); if (escaped) { escaped = false; } else if (c === "\\") { escaped = true; } else if (c === ch) break; } return "string"; }
          // backtick identifiers
          if (ch === "`") { stream.next(); while (!stream.eol()) { const c = stream.next(); if (c === "\\") { stream.next(); } else if (c === "`") break; } return "variable-2"; }
          // numbers
          if (/[\d.]/.test(ch) && stream.match(/^[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?/)) return "number";
          // operators / punctuation
          if (ops.indexOf(ch) !== -1) { stream.next(); return "operator"; }
          if (/[();\[\]]/.test(ch)) { stream.next(); return "punctuation"; }
          // word
          if (stream.match(/^[a-zA-Z_$][a-zA-Z0-9_$]*/)) {
            if (kwSet[stream.current().toUpperCase()]) return "keyword";
            return null;
          }
          stream.next();
          return null;
        }
      };
    });
    CodeMirror.defineMIME("text/x-mysql", "mysql");
  })();

  function parseError(err, text) {
    const msg = err && err.message ? err.message : String(err);
    let pos = null;
    let m = msg.match(/position\s+(\d+)/i);
    if (m) pos = parseInt(m[1], 10);
    if (pos == null) {
      m = msg.match(/line\s+(\d+)\s+column\s+(\d+)/i);
      if (m) {

        let p = 0;
        for (let i = 0; i < parseInt(m[1], 10) - 1 && i < lines.length; i++) p += lines[i].length + 1;
        pos = p + (parseInt(m[2], 10) - 1);

    return { msg: msg, pos: pos };
  }

  function renderValue(value, label, opts) {

  /* ---------- relationship graph view (entity/ER style) ---------- */
  function formatScalar(v) {
    if (v === null) return "null";
    if (typeof v === "string") return showEscaped ? JSON.stringify(v) : v;
    return String(v);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];

  function truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  let graphNodes = [], graphEdges = [], graphRoot = null, graphSelectedId = null;
  const collapsed = new Set();
  const GN_W = 200, V_GAP = 30, MARGIN = 48, LEVEL_GAP = 92;
  // 节点统一成「表格框」：不再有独立标题栏 / 元素名，表头方向按数据结构区分 ——
  //   对象（含根节点）：表头「竖向」（左列 = 字段名，右列 = 值，每字段一行）
  //   数组            ：表头「横向」（顶行 = 字段名，左列 = 元素下标 [i]）
  // 数组合并框：横表头 = 字段名，竖表头 = 元素下标 [i]，其余为单元格
  const T_HEAD_H = 24, T_ROW_H = 24, T_PAD_X = 8, T_MIN_COL = 52, T_MAX_COL = 180, T_ROW_CAP = 40, T_COL_CAP = 10;
  // 对象框（含根节点）：字段竖向排列（每字段一行 key | value），标题栏高 / 行高 / 键列宽
  const G_HEAD_H = 26, G_ROW_H = 22, G_KEY_W = 80;
  const G_KEY_MIN = 52, G_KEY_MAX = 150, G_VAL_MIN = 108, G_VAL_MAX = 260;
  function isRootNode(n) { return n === graphRoot; }
  let panX = 0, panY = 0, worldW = 0, worldH = 0, graphRootG = null;

  function buildGraph(data) {
    graphNodes = []; graphEdges = [];
    let nid = 0;
    const CAP = 500;
    function makeNode(label, kind) {
      const n = { id: "n" + (nid++), label: label, kind: kind, attrs: [], children: [], x: 0, y: 0, w: GN_W, h: 0, subW: GN_W, value: undefined, seq: false, childCount: 0, userDX: 0, userDY: 0 };
      graphNodes.push(n);
      return n;
    }
    // 每条「父→子」边带一个稳定 key（父 id + 出口行 row）：同一字段行（如数组多个元素）
    // 共享同一 key，因此一个开关即可收起/展开整行（含全部子元素）；
    // to.parentEdge 供遍历时判断该子树是否被收起
    function addEdge(from, to, label, fromRow) {
      const e = { from: from, to: to, label: label, seq: false, fromRow: fromRow, key: from.id + "#" + fromRow };
      graphEdges.push(e);
      to.parentEdge = e;
      return e;
    }
    // 单元格取值：标量直接显示；对象 / 数组只给长度标识 {N} / [N]（具体内容由子框展开）
    function cellOf(v) {
      const vt = typeOf(v);
      if (vt === "array") return { text: "[" + v.length + "]", cls: "arr" };
      if (vt === "object") return { text: "{" + Object.keys(v).length + "}", cls: "obj" };
      return { text: formatScalar(v), cls: "", t: vt };
    }
    // 数组合并成「一个表格框」：横表头 = 各元素字段名（对象数组）或空（标量列表），
    // 竖表头 = 元素下标 [i]，单元格 = 字段值。不再为每个元素单独建框、也不再显示 [i] 元素名。
    function buildArray(arr, label, path) {
      const node = makeNode(label, "array");
      node.path = path;
      node.childCount = arr.length;
      const total = arr.length, shown = Math.min(total, T_ROW_CAP);
      let objCnt = 0;
      for (let i = 0; i < shown; i++) if (typeOf(arr[i]) === "object") objCnt++;
      const asTable = shown > 0 && objCnt === shown;   // 元素全是对象 → 二维表（有横表头）
      let cols = [], hiddenCols = 0;
      if (asTable) {
        const allKeys = [], seen = {};
        for (let i = 0; i < shown; i++) {
          Object.keys(arr[i]).forEach(function (k) {
            if (!seen[k]) { seen[k] = 1; allKeys.push(k); }
          });
        }
        if (allKeys.length > T_COL_CAP) {                // 字段过多：末列折成「…」并标出被折叠的字段数
          hiddenCols = allKeys.length - (T_COL_CAP - 1);
          cols = allKeys.slice(0, T_COL_CAP - 1).concat(["…"]);
        } else {
          cols = allKeys;
        }
      }
      node.cols = cols;
      node.hiddenCols = hiddenCols;
      node.rows = [];
      for (let i = 0; i < shown; i++) {
        const row = { label: "[" + i + "]", path: path.concat(i), cells: [] };
        if (asTable) cols.forEach(function (k) {
          row.cells.push(k === "…" ? { text: "+" + hiddenCols, cls: "more" } : cellOf(arr[i][k]));
        });
        else row.cells.push(cellOf(arr[i]));
        node.rows.push(row);
      }
      if (total > T_ROW_CAP) node.rows.push({ label: "", path: null, cells: [{ text: "另 " + (total - T_ROW_CAP) + " 项", cls: "more" }] });
      if (node.rows.length === 0) node.rows.push({ label: "", path: null, cells: [{ text: "(空数组)", cls: "more" }] });
      // 单元格里的对象 / 数组：各建子框，从所在元素行的右侧连出
      if (asTable) {
        for (let i = 0; i < shown && graphNodes.length < CAP; i++) {
          cols.forEach(function (k) {
            if (graphNodes.length >= CAP) return;
            const v = arr[i][k], vt = typeOf(v);
            if (vt === "array") {
              const c = buildArray(v, k, path.concat(i, k));
              addEdge(node, c, k, i);
              node.children.push(c);
            } else if (vt === "object") {
              const c = makeNode(k, "object");
              c.value = v; c.path = path.concat(i, k);
              c.childCount = Object.keys(v).length;
              fillObject(c, v, path.concat(i, k));
              addEdge(node, c, k, i);
              node.children.push(c);
            }
          });
        }
      }
      return node;
    }
    // 对象：字段写进 attrs（横表头 + 值行），嵌套的数组 / 对象各自建子框
    function fillObject(node, obj, path) {
      Object.keys(obj).forEach(function (k) {
        if (graphNodes.length >= CAP) return;
        const v = obj[k], vt = typeOf(v);
        if (vt === "array") {
          node.attrs.push({ k: k, v: "[" + v.length + "]", arr: true });
          const c = buildArray(v, k, path.concat(k));
          addEdge(node, c, k, node.attrs.length - 1);
          node.children.push(c);
        } else if (vt === "object") {
          node.attrs.push({ k: k, v: "{" + Object.keys(v).length + "}", obj: true });
          const c = makeNode(k, "object");
          c.value = v; c.path = path.concat(k);
          c.childCount = Object.keys(v).length;
          fillObject(c, v, path.concat(k));
          addEdge(node, c, k, node.attrs.length - 1);
          node.children.push(c);
        } else {
          node.attrs.push({ k: k, v: formatScalar(v), t: vt });
        }
      });
      // 空对象：给一行占位，避免竖向表格框变成 0 高（无表头可显示）
      if (node.attrs.length === 0) node.attrs.push({ k: "(空对象)", v: "", more: true });
    }
    const t = typeOf(data);
    if (t === "object") {
      graphRoot = makeNode("根", "object");
      graphRoot.value = data; graphRoot.path = [];
      graphRoot.childCount = Object.keys(data).length;
      fillObject(graphRoot, data, []);
    } else if (t === "array") {
      // 根为数组：建一个根容器，数组本身合并成一个表格框挂在根下
      graphRoot = makeNode("根", "object");
      graphRoot.value = data; graphRoot.path = [];
      graphRoot.childCount = data.length;
      graphRoot.attrs.push({ k: "根", v: "[" + data.length + "]", arr: true });
      const c = buildArray(data, "根", []);
      addEdge(graphRoot, c, "", 0);
      graphRoot.children.push(c);
    } else {
      graphRoot = makeNode("根", "scalar");
      graphRoot.value = data; graphRoot.path = [];
      graphRoot.attrs.push({ k: "值", v: formatScalar(data), t: t });
    }
  }

  // 左→右布局：深度决定水平位置（越往右层级越低），兄弟节点沿垂直方向堆叠
  function computeSubtree(n) {
    if (n.children.length === 0) { n.subH = n.h; return n.subH; }
    let h = 0;
    n.children.forEach(function (c) { h += computeSubtree(c) + V_GAP; });
    h -= V_GAP;
    n.subH = Math.max(n.h, h);
    return n.subH;
  }
  // 水平位置按层级(深度)决定：每层起点 = 上一层起点 + 上一层最宽节点 + 层间距，
  // 这样合并后的表格框变宽也不会压到下一层
  let depthX = [0];
  function setX(n, depth) { n.x = depthX[depth] || 0; n.children.forEach(function (c) { setX(c, depth + 1); }); }
  // 垂直位置：叶子自上而下堆叠，父节点居中于其子节点范围
  function assignY(n, y0) {
    n.y = y0 + (n.subH - n.h) / 2;
    if (n.children.length === 0) return;
    let cy = y0;
    n.children.forEach(function (c) { assignY(c, cy); cy += c.subH + V_GAP; });
  }

  // 文本宽度粗估（中文按 1em、ASCII 按 0.56em），用于表格框列宽自适应
  function textW(s, size) {
    s = String(s);
    let w = 0;
    for (let i = 0; i < s.length; i++) w += (s.charCodeAt(i) > 255 ? 1 : 0.56) * size;
    return w;
  }
  // 数组合并框的尺寸：竖表头列宽 + 各数据列宽（按表头 / 单元格文本自适应）
  function layoutArrayNode(n) {
    const hasHead = n.cols.length > 0;
    const ncol = hasHead ? n.cols.length : 1;
    const colW = [];
    for (let c = 0; c < ncol; c++) {
      let mx = hasHead ? textW(truncate(n.cols[c], 14), 11) : 0;
      n.rows.forEach(function (r) {
        if (r.cells[c]) mx = Math.max(mx, textW(truncate(r.cells[c].text, 14), 11));
      });
      colW.push(Math.max(T_MIN_COL, Math.min(T_MAX_COL, Math.ceil(mx) + T_PAD_X * 2)));
    }
    let lw = 26;
    n.rows.forEach(function (r) { lw = Math.max(lw, Math.ceil(textW(r.label, 10.5)) + 12); });
    // 数值列整列右对齐（表格惯例：数字靠右、文本靠左）
    n.colAlignEnd = [];
    for (let c = 0; c < ncol; c++) {
      let allNum = true, any = false;
      n.rows.forEach(function (r) {
        const cell = r.cells[c];
        if (!cell) return;
        any = true;
        if (cell.cls || !/^-?\d+(\.\d+)?$/.test(String(cell.text).trim())) allNum = false;
      });
      n.colAlignEnd.push(any && allNum);
    }
    n.labelW = Math.min(lw, 64);
    n.colW = colW;
    n.hasHead = hasHead;
    n.w = n.labelW + colW.reduce(function (a, b) { return a + b; }, 0);
    n.h = (hasHead ? T_HEAD_H : 0) + n.rows.length * T_ROW_H;
  }
  // 对象框（含根节点）的尺寸：左「竖表头」列宽（按字段名自适应）+ 右值列宽（按值文本自适应）
  // 仅根节点多一条顶部标题栏；其余对象框没有标题栏，竖表头直接从框顶开始
  function layoutObjectBox(n) {
    const isRoot = isRootNode(n);
    // 竖表头列宽：按最长字段名自适应（根节点下限 80，其余下限 52，上限统一 150）
    let kx = isRoot ? G_KEY_W : G_KEY_MIN;
    n.attrs.forEach(function (a) { kx = Math.max(kx, Math.ceil(textW(truncate(a.k, 14), 11)) + 18); });
    const kw = Math.min(kx, G_KEY_MAX);
    let vx = isRoot ? 170 : G_VAL_MIN;
    n.attrs.forEach(function (a) { vx = Math.max(vx, Math.ceil(textW(truncate(a.v, 20), 11)) + 20); });
    n.keyW = kw;
    n.valW = Math.min(vx, G_VAL_MAX);
    n.w = kw + n.valW;
    n.h = (isRoot ? G_HEAD_H : 0) + Math.max(1, n.attrs.length) * G_ROW_H;
  }
  // 字段行几何：rowTop = 该框数据区顶部（根节点要让开标题栏、数组要让开横表头）；
  // rowH = 行高（数组元素行用 T_ROW_H，对象字段行用 G_ROW_H）
  function rowTopOf(n) {
    if (isRootNode(n)) return n.y + G_HEAD_H;
    if (n.kind === "array") return n.y + (n.hasHead ? T_HEAD_H : 0);
    return n.y;
  }
  function rowHOf(n) { return n.kind === "array" ? T_ROW_H : G_ROW_H; }
  // 值类型 → 着色 class（t-num / t-str / t-bool / t-null），供 .gnode-val.t-* 用
  function tcls(t) {
    return t === "number" ? " t-num" : t === "string" ? " t-str"
      : t === "boolean" ? " t-bool" : t === "null" ? " t-null" : "";
  }
  // 顶部横表头条：仅上方两角圆角，底部平齐
  function headBand(x, y, w, hh) {
    return '<path class="gnode-head" d="M' + x + ',' + (y + 4) + ' a4,4 0 0 1 4,-4 h' + (w - 8) + ' a4,4 0 0 1 4,4 v' + (hh - 4) + ' h-' + w + ' z"/>';
  }
  // 对象框（根节点 / 普通对象）统一渲染：左「竖表头」列（字段名，浅底）+ 右值列，
  // 每字段一行；根节点额外带顶部标题栏。与数组框的「横表头」形成区分。
  function renderObjectBox(n) {
    const isRoot = isRootNode(n);
    const x = n.x, y = n.y, w = n.w, kw = n.keyW;
    const bodyY = y + (isRoot ? G_HEAD_H : 0);
    let s = '<rect class="gnode-rect object" x="' + x + '" y="' + y + '" width="' + w + '" height="' + n.h + '" rx="4"/>';
    if (isRoot) {
      s += headBand(x, y, w, G_HEAD_H);
      s += '<text class="gnode-title" x="' + (x + 10) + '" y="' + (y + 17) + '">' + esc(truncate(n.label, 18)) + '</text>';
      s += '<line class="grow-div" x1="' + x + '" y1="' + bodyY + '" x2="' + (x + w) + '" y2="' + bodyY + '"/>';
    }
    // 竖表头列浅底（字段名列），斑马纹只铺值列，避免互相覆盖；
    // 竖表头列浅底（字段名列），斑马纹只铺值列，避免互相覆盖；
    // 浅底从表头下沿一直延伸到框底，四周各留 1px 不与外框贴边
    // （框线由 .gnode-border 最后统一绘制，底色也不戳出圆角）
    const sideTop = bodyY + (bodyY <= y + 0.5 ? 1 : 0);
    s += '<rect class="gnode-side" x="' + (x + 1) + '" y="' + sideTop + '" width="' + Math.max(0, kw - 1) + '" height="' + Math.max(0, y + n.h - 1 - sideTop) + '"/>';
    n.attrs.forEach(function (a, i) {
      const ry = bodyY + i * G_ROW_H;
      if (i % 2 === 1) s += '<rect class="gnode-zebra" x="' + (x + kw) + '" y="' + ry + '" width="' + (w - kw - 1) + '" height="' + G_ROW_H + '"/>';
      if (i > 0) s += '<line class="grow-div" x1="' + x + '" y1="' + ry + '" x2="' + (x + w) + '" y2="' + ry + '"/>';
      s += '<line class="grow-div col" x1="' + (x + kw) + '" y1="' + ry + '" x2="' + (x + kw) + '" y2="' + (ry + G_ROW_H) + '"/>';
      // 行命中层先画（在文字下方），悬停高亮才不会盖住内容
      if (n.kind === "object") s += '<rect class="gnode-row clickable" data-key="' + esc(a.k) + '" x="' + x + '" y="' + ry + '" width="' + w + '" height="' + G_ROW_H + '"/>';
      const ty = ry + G_ROW_H / 2 + 4;
      s += '<text class="gnode-key' + (a.more ? " more" : "") + '" x="' + (x + 8) + '" y="' + ty + '">' + esc(truncate(a.k, 14)) + '</text>';
      const vcls = a.arr ? " arr" : (a.obj ? " obj" : (a.more ? " more" : ""));
      s += '<text class="gnode-val' + vcls + tcls(a.t) + '" x="' + (x + w - 10) + '" y="' + ty + '" text-anchor="end">' + esc(truncate(a.v, 20)) + '</text>';
    });
    // 边框覆盖层：最后绘制，保证四周框线粗细一致、不被底色盖住
    s += '<rect class="gnode-border" x="' + x + '" y="' + y + '" width="' + w + '" height="' + n.h + '" rx="4"/>';
    return s;
  }
  // 数组合并框：横表头（字段名）+ 竖表头（元素下标 [i]）+ 单元格
  function renderArrayNode(n) {
    const x = n.x, y = n.y, w = n.w;
    const hasHead = n.hasHead, hh = hasHead ? T_HEAD_H : 0, lw = n.labelW;
    let s = '<rect class="gnode-rect array" x="' + x + '" y="' + y + '" width="' + w + '" height="' + n.h + '" rx="4"/>';
    if (hasHead) s += headBand(x, y, w, hh);
    const bodyTop = y + hh;
    const bodyBot = bodyTop + n.rows.length * T_ROW_H;
    // 竖表头与数据列之间的分隔线
    s += '<line class="grow-div col" x1="' + (x + lw) + '" y1="' + y + '" x2="' + (x + lw) + '" y2="' + bodyBot + '"/>';
    // 各数据列的竖向网格
    let gx = x + lw;
    for (let c = 0; c < n.colW.length - 1; c++) {
      gx += n.colW[c];
      s += '<line class="grow-div col" x1="' + gx + '" y1="' + bodyTop + '" x2="' + gx + '" y2="' + bodyBot + '"/>';
    }
    if (hasHead) s += '<line class="grow-div" x1="' + x + '" y1="' + bodyTop + '" x2="' + (x + w) + '" y2="' + bodyTop + '"/>';
    // 竖表头列浅底（元素下标列），斑马纹只铺数据列；内缩 1px 不与外框贴边
    const sideFlushTop = (bodyTop <= y + 0.5);
    const sideH = n.rows.length * T_ROW_H - (sideFlushTop ? 1 : 0) - (bodyBot >= y + n.h - 0.5 ? 1 : 0);
    s += '<rect class="gnode-side" x="' + (x + 1) + '" y="' + (bodyTop + (sideFlushTop ? 1 : 0)) + '" width="' + Math.max(0, lw - 1) + '" height="' + sideH + '"/>';
    n.rows.forEach(function (r, i) {
      const ry = bodyTop + i * T_ROW_H;
      if (i % 2 === 1) s += '<rect class="gnode-zebra" x="' + (x + lw) + '" y="' + ry + '" width="' + (w - lw - 1) + '" height="' + T_ROW_H + '"/>';
      if (i > 0) s += '<line class="grow-div" x1="' + x + '" y1="' + ry + '" x2="' + (x + w) + '" y2="' + ry + '"/>';
      // 行命中层先画（在文字下方），悬停高亮才不会盖住内容
      if (r.path) s += '<rect class="gnode-row clickable" data-path="' + esc(JSON.stringify(r.path)) + '" x="' + x + '" y="' + ry + '" width="' + w + '" height="' + T_ROW_H + '"/>';
      const ty = ry + T_ROW_H / 2 + 4;
      if (r.label) s += '<text class="gnode-idx" x="' + (x + lw - 8) + '" y="' + ty + '" text-anchor="end">' + esc(r.label) + '</text>';
      let cxp = x + lw;
      r.cells.forEach(function (cell, ci) {
        const cwid = n.colW[ci] || 0;
        const end = n.colAlignEnd[ci];
        const tx = end ? (cxp + cwid - T_PAD_X) : (cxp + T_PAD_X);
        s += '<text class="gnode-val' + (cell.cls ? " " + cell.cls : "") + tcls(cell.t) + '" x="' + tx + '" y="' + ty + '"' + (end ? ' text-anchor="end"' : '') + '>' + esc(truncate(cell.text, 14)) + '</text>';
        cxp += cwid;
      });
    });
    if (hasHead) {
      let hxp = x + lw;
      const hy = y + hh / 2 + 4;
      n.cols.forEach(function (k, ci) {
        const cwid = n.colW[ci] || 0;
        const end = n.colAlignEnd[ci];
        const tx = end ? (hxp + cwid - T_PAD_X) : (hxp + T_PAD_X);
        s += '<text class="gnode-key" x="' + tx + '" y="' + hy + '"' + (end ? ' text-anchor="end"' : '') + '>' + esc(truncate(k, 14)) + '</text>';
        hxp += cwid;
      });
    }
    // 边框覆盖层：最后绘制，保证四周框线粗细一致、不被底色盖住
    s += '<rect class="gnode-border" x="' + x + '" y="' + y + '" width="' + w + '" height="' + n.h + '" rx="4"/>';
    return s;
  }
  function renderNodeBox(n) {
    if (n.kind === "array") return renderArrayNode(n);
    return renderObjectBox(n);          // 根节点与普通对象共用「竖向表头」样式
  }

  function drawGraph() {
    if (graphRoot === null) { graphSvg = null; graphRootG = null; worldW = 0; worldH = 0; return; }
    graphNodes.forEach(function (n) {
      if (n.kind === "array") layoutArrayNode(n);       // 数组：横表头 + 竖表头（下标）
      else layoutObjectBox(n);                          // 对象（含根节点）：竖表头 + 值列
    });
    // 按层收集最宽节点，算出每一层的水平起点
    const depthW = [];
    (function measure(n, d) {
      if (depthW[d] === undefined || n.w > depthW[d]) depthW[d] = n.w;
      n.children.forEach(function (c) { measure(c, d + 1); });
    })(graphRoot, 0);
    depthX = [];
    let dx = 0;
    depthW.forEach(function (w) { depthX.push(dx); dx += w + LEVEL_GAP; });
    computeSubtree(graphRoot);
    assignY(graphRoot, 0);
    setX(graphRoot, 0);
    let maxX = 0;
    graphNodes.forEach(function (n) { n.x += MARGIN + (n.userDX || 0); n.y += MARGIN + (n.userDY || 0); if (n.x + n.w > maxX) maxX = n.x + n.w; });
    worldW = maxX + MARGIN;
    worldH = graphRoot.subH + MARGIN * 2;

    const visibleSet = new Set();
    // 收起的字段行：该节点及其整棵子树（含自身框）整体不可见；否则递归展示子节点
    (function collect(n, hidden) {
      if (hidden) return;
      visibleSet.add(n.id);
      n.children.forEach(function (c) { collect(c, c.parentEdge && collapsed.has(c.parentEdge.key)); });
    })(graphRoot, false);

    let edges = "";
    graphEdges.forEach(function (e) {
      if (!visibleSet.has(e.from.id) || !visibleSet.has(e.to.id)) return;
      const p = e.from, c = e.to;
      if (e.seq) {
        // 兄弟序列连线（垂直）：[i] 底部中点 → [i+1] 顶部中点
        const x1 = p.x + p.w / 2, y1 = p.y + p.h, x2 = c.x + c.w / 2, y2 = c.y;
        const my = (y1 + y2) / 2;
        edges += '<path class="gedge seq" d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + y2 + '"/>';
      } else {
        // 父子连线（水平）：从父框内「对应字段行」的右缘中点连出 → 子左侧中点
        // （对象字段行 / 数组元素行都是「行」，只是行高与数据区起点不同）
        const fr = (typeof e.fromRow === "number") ? e.fromRow : 0;
        const rh = rowHOf(p);
        const x1 = p.x + p.w;
        const y1 = rowTopOf(p) + fr * rh + rh / 2;
        const x2 = c.x, y2 = c.y + c.h / 2;
        const mx = (x1 + x2) / 2, mid = (y1 + y2) / 2;
        edges += '<path class="gedge" d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>';
        if (e.label) {
          const tw = esc(e.label).length * 6 + 10;
          edges += '<rect class="gedge-label-bg" x="' + ((x1 + x2) / 2 - tw / 2) + '" y="' + (mid - 12) + '" width="' + tw + '" height="14" rx="3"/>';
          edges += '<text class="gedge-label" x="' + ((x1 + x2) / 2) + '" y="' + (mid - 1) + '" text-anchor="middle">' + esc(e.label) + '</text>';
        }
      }
    });
    let nodes = "";
    graphNodes.forEach(function (n) {
      if (!visibleSet.has(n.id)) return;
      const sel = (n.id === graphSelectedId) ? " selected" : "";
      nodes += '<g class="gnode' + sel + '" data-id="' + n.id + '">';
      nodes += renderNodeBox(n);
      nodes += '</g>';
    });
    // 每个「有子节点的字段行」在其行尾部（父框右缘、该行中线）各画一个收起/展开小开关；
    // 可折叠判定：同一出口行有多个子框，或唯一子框是「多行」的数组合并框。
    // 单行数组合并框 / 单个对象框则不显示按钮（无可折叠内容）。
    const edgeKeyCount = {};
    graphEdges.forEach(function (e) { if (!e.seq) edgeKeyCount[e.key] = (edgeKeyCount[e.key] || 0) + 1; });
    const drawnSwitchKeys = new Set();
    graphEdges.forEach(function (e) {
      if (e.seq) return;
      const multiRow = (e.to && e.to.kind === "array" && e.to.rows.length > 1);
      if (!multiRow && edgeKeyCount[e.key] === 1) {         // 子级仅 1 个元素：不显示按钮，并确保未被收起
        collapsed.delete(e.key);
        return;
      }
      if (!visibleSet.has(e.from.id)) return;              // 只要父字段可见就画开关（被收起的子框也需开关以便重新展开）
      if (drawnSwitchKeys.has(e.key)) return;              // 同一字段列只画一个开关
      drawnSwitchKeys.add(e.key);
      const p = e.from;
      const fr = (typeof e.fromRow === "number") ? e.fromRow : 0;
      const rh = rowHOf(p);
      // 开关固定在该字段行尾部（父框右缘、行的垂直中线）
      const cy = rowTopOf(p) + fr * rh + rh / 2;
      const cx = p.x + p.w + 9;
      const open = !collapsed.has(e.key);
      const ccls = open ? "open" : "closed";
      nodes += '<g class="gcollapse ' + ccls + '" data-key="' + esc(e.key) + '">';
      nodes += '<title>' + (open ? "收起该字段" : "展开该字段") + '</title>';
      nodes += '<circle cx="' + cx + '" cy="' + cy + '" r="6"/>';
      nodes += '<text x="' + cx + '" y="' + (cy + 3.6) + '" text-anchor="middle">' + (open ? "–" : "+") + '</text>';
      nodes += '</g>';
    });
    graphView.innerHTML = '<svg id="graphSvg" width="' + graphView.clientWidth + '" height="' + graphView.clientHeight + '"><g id="graphRootG" transform="translate(' + panX + ',' + panY + ') scale(' + graphScale + ')">' + edges + nodes + '</g></svg>';
    graphSvg = document.getElementById("graphSvg");
    graphRootG = document.getElementById("graphRootG");
    bindGraphNodeEvents();
    applyGraphRowHighlight();        // 重绘（拖拽等）后恢复行级高亮
    refreshMinimap();
  }

  function applyGraphTransform() {
    if (graphRootG) graphRootG.setAttribute("transform", "translate(" + panX + "," + panY + ") scale(" + graphScale + ")");
    refreshMinimap();
  }

  function fitGraph() {
    const cw = graphView.clientWidth, ch = graphView.clientHeight;
    if (!cw || !ch || worldW <= 0) return;
    const pad = 56;
    // 以「高度」为适配基准，横向不强行铺满视口 —— 当内容比视口宽时，
    // 画布会超出视口、高亮框变窄，从而可用缩略图/拖拽左右平移
    let s = (ch - pad) / worldH;
    s = Math.max(0.2, Math.min(s, 1.6));
    graphScale = s;
    const sw = worldW * s, sh = worldH * s;
    // 横向：内容比视口宽则左对齐（可向右拖拽平移），否则居中
    panX = sw <= cw ? (cw - sw) / 2 : 0;
    // 纵向：内容比视口高则顶部对齐（可向下拖拽），否则居中
    panY = sh <= ch ? (ch - sh) / 2 : 0;
    applyGraphTransform();
  }

    const p = activePath.map(function (x) { return x.label; }).join("/");
    return navRootLabel + "|" + p + "|" + (leafSel ? leafSel.label : "");
  }
  function pushNavHistory() {
    if (navApplying || navContext === undefined) return;
    const snap = { navContext: navContext, navRootLabel: navRootLabel, rootSel: rootSel, activePath: activePath.slice(), leafSel: leafSel };
    if (navHistIdx >= 0) {
      const prev = navHist[navHistIdx];
      const same = (prev.navRootLabel === snap.navRootLabel) &&
        (prev.activePath.map(function (x) { return x.label; }).join("/") === snap.activePath.map(function (x) { return x.label; }).join("/")) &&
        ((prev.leafSel && prev.leafSel.label) === (snap.leafSel && snap.leafSel.label || null)) &&
        ((prev.rootSel && prev.rootSel.label) === (snap.rootSel && snap.rootSel.label || null));
      if (same) { updateNavButtons(); return; }
    }
    navHist = navHist.slice(0, navHistIdx + 1);
    navHist.push(snap);
    if (navHist.length > 60) navHist.shift();
    navHistIdx = navHist.length - 1;
    updateNavButtons();
  }
  function applyNavSnapshot(s) {
    navApplying = true;
    navContext = s.navContext; navRootLabel = s.navRootLabel;
    rootSel = s.rootSel; activePath = s.activePath.slice(); leafSel = s.leafSel;
    renderNav();
    navApplying = false;
    updateNavButtons();
  }
  function navGo(delta) {
    const t = navHistIdx + delta;
    if (t < 0 || t >= navHist.length) return;
    navHistIdx = t;
    applyNavSnapshot(navHist[t]);
  }
  function updateNavButtons() {
    if (btnNavBack) btnNavBack.disabled = (navHistIdx <= 0);
    if (btnNavFwd) btnNavFwd.disabled = (navHistIdx >= navHist.length - 1);
  }
  // 行尾角标：容器显示长度 {N} / [N]，标量显示类型名（对齐 treease 的行角标）
  function navBadgeText(ent) {
    const v = ent.value;
    if (Array.isArray(v)) return "[" + v.length + "]";
    if (v && typeof v === "object") return "{" + Object.keys(v).length + "}";
    return ent.type;
  }

  function makeNavItems(container, selectedLabel, onClick) {
    const frag = document.createDocumentFragment();
    const entries = entriesOf(container);
    if (entries.length === 0) { frag.appendChild(el("div", "nav-empty", "（空）")); return frag; }
    entries.forEach(function (ent) {
      const item = el("button", "nav-item");
      item.type = "button";
      item.title = ent.label;
      item.appendChild(el("span", "ni-label", ent.label));
      // 角标规则（全部常显）：数组/对象显示元素数量 [N] / {N}，标量显示类型名 string / number…
      item.appendChild(el("span", "ni-badge", navBadgeText(ent)));
      const isContainer = (ent.type === "array" || ent.type === "object");
      item.appendChild(el("span", "ni-chev", isContainer ? "›" : ""));
      if (selectedLabel != null && ent.label === selectedLabel) item.classList.add("sel");
      if (isContainer) item.classList.add("has-child");
      item.addEventListener("click", function () { onClick(ent); });
      frag.appendChild(item);
    });
    return frag;
  }

  // 最终值列：始终显示「当前选中节点」的内容 —— 容器给无美化/无缩进的紧凑 JSON，标量给原值
  function valueDisplayText(v) {
    if (v === undefined) return "";
    if (isContainer(v)) return JSON.stringify(v);          // 无缩进、无美化
    const t = typeOf(v);
    if (t === "null") return "null";
    if (t === "string") return showEscaped ? JSON.stringify(v) : v;
    return String(v);
  }

  function showValueInPanel(v) {
    selValueBody.innerHTML = "";
    if (v === undefined) {
      selValueBody.appendChild(el("div", "nav-empty", "在下方列中选择 元素 / 字段 后，这里显示其内容。"));
      return;
    }
    const t = typeOf(v);
    const label = el("div", "val-label");
    label.appendChild(el("span", "type-badge", t));
    selValueBody.appendChild(label);

    const pre = el("pre", "val-pre");
    const text = valueDisplayText(v);
    pre.textContent = text;
    selValueBody.appendChild(pre);
    const copy = el("button", "btn tiny", isContainer(v) ? "复制 JSON" : "复制");
    copy.addEventListener("click", function () { copyText(text, copy); });
    selValueBody.appendChild(copy);
  }

  function copyText(text, btn) {
    function done() { btn.textContent = "已复制"; setTimeout(function () { btn.textContent = btn._orig || "复制"; }, 1200); }
    btn._orig = btn.textContent;
    try { navigator.clipboard.writeText(text); done(); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e2) {}
      ta.remove();
    }
  }

  /* 多级下钻列：第 0 列 = 根条目；第 k 列 = activePath[k-1] 的内容。
     每选中一级就多出一列，之前的列不隐藏；列数不限，超出宽度由 .sel-cols 横向滚动。 */
  function renderNav() {
    if (navContext === undefined) {
      selCols.innerHTML = '<div class="nav-empty">解析 JSON 后，可在此逐级选择元素 / 字段，查看最终值。</div>';
      selValueBody.innerHTML = "";
      showValueInPanel(undefined);
      if (selHeadPath) selHeadPath.textContent = "";
      updateNavButtons();
      return;
    }
    selCols.innerHTML = "";
    // 第 k 列的点击：容器 -> 截断到该列并进入下一级；叶子 -> 截断到该列并选中该叶子
    function clickEnt(k, ent) {
      if (isContainer(ent.value)) {
        activePath = activePath.slice(0, k).concat([ent]);
        leafSel = null;
      } else {
        activePath = activePath.slice(0, k);
        leafSel = ent;
      }
      rootSel = activePath.length ? activePath[0] : null;
      renderNav();
      // 三向联动（面板 -> 编辑器 + 画布）：由 label 序列还原真实路径
      const labels = activePath.map(function (p) { return p.label; }).concat(leafSel ? [leafSel.label] : []);
      const segs = pathSegsFromLabels(labels);
      if (segs) {
        highlightInEditor(segs);
        graphSelectBySegs(segs, true);
      }
    }
    function addCol(title, container, selectedLabel, k) {
      // 数组容器（条目为 [0] [1]…）的列宽减半（.arr-col）
      const col = el("div", "sel-col" + (Array.isArray(container) ? " arr-col" : ""));
      col.appendChild(el("div", "sel-col-title", title));
      const scroll = el("div", "sel-col-scroll");
      scroll.appendChild(makeNavItems(container, selectedLabel, function (ent) { clickEnt(k, ent); }));
      col.appendChild(scroll);
      selCols.appendChild(col);
    }
    // 第 0 列：根（选中根下的叶子字段时 activePath 为空、选中项在 leafSel，也要高亮）
    addCol(Array.isArray(navContext) ? "数组元素" : "字段", navContext,
      activePath.length ? activePath[0].label : (leafSel ? leafSel.label : null), 0);
    // 第 1..n 列：逐级下钻
    activePath.forEach(function (p, i) {
      addCol(p.label, p.value, (i + 1 < activePath.length ? activePath[i + 1].label : (leafSel ? leafSel.label : null)), i + 1);
    });
    // 新下钻的一级始终滚入视野
    requestAnimationFrame(function () { selCols.scrollLeft = selCols.scrollWidth; });
    // 最终值列：始终显示当前选中（叶子优先，其次最深层容器，最后是根）
    const av = activeValue();
    showValueInPanel(leafSel ? leafSel.value : (av !== undefined ? av : navContext));
    // 当前路径（面板头暂时注释，元素存在时才更新）
    if (selHeadPath) selHeadPath.textContent = buildPathString();
    pushNavHistory();
  }

  function openInNavigator(value, rootLabel) {
    // 换了一份数据（重新解析）时清空导航历史，避免持有旧对象引用
    if (value !== navContext) { navHist = []; navHistIdx = -1; }
    selPanelClosed = false;                 // 显式查看 -> 重新打开「当前元素」
    navContext = value;
    navRootLabel = rootLabel || "根";
    rootSel = null;
    activePath = [];
    leafSel = null;
    renderNav();
    updatePanels();
  }

  // 从「全局根」出发按 path 逐级下钻：第一列高亮根下的当前字段，后续列展示下一级的当前字段
  function navigateToRootPath(path) {
    if (currentData === undefined) return;
    selPanelClosed = false;                 // 选中节点/字段 -> 面板出现
    navContext = currentData;
    navRootLabel = "根";
    rootSel = null;
    activePath = [];
    leafSel = null;
    if (!path || !path.length) { renderNav(); updatePanels(); return; }
    const rootEntries = entriesOf(currentData);
    const r0 = rootEntries.find(function (e) { return String(e.label) === String(path[0]); });
    if (r0) rootSel = r0;
    let parent = currentData;
    for (let i = 0; i < path.length; i++) {
      const key = path[i];
      if (!parent || typeof parent !== "object") break;
      const cur = parent[key];
      if (cur === undefined) break;
      // label 与 entriesOf 保持一致：数组下标写成 [i]，对象字段用键名
      const label = Array.isArray(parent) ? "[" + key + "]" : String(key);
      const isLast = (i === path.length - 1);
      if (!isLast || isContainer(cur)) activePath.push({ label: label, value: cur, type: typeOf(cur) });
      else leafSel = { label: label, value: cur, type: typeOf(cur) };
      parent = cur;
    }
    renderNav();
    updatePanels();
  }

  /* ---------- main parse flow ---------- */
  let timer = null;
  function process() {
    if (appMode !== "json") return;
    clearTimeout(timer);
    timer = setTimeout(doProcess, 220);
  }
  function doProcess() {
    const text = editor.getValue();
    clearErrorMarks();
    clearEditorHighlight();
    errBox.classList.remove("show");

    if (text.trim() === "") {
      setBadge(leftBadge, "等待输入", "");
      setBadge(rightBadge, "—", "");
      output.innerHTML = '<div class="placeholder">在左侧粘贴 JSON 后，这里会显示图形化结构。数组会自动渲染为表格。点行号旁 ▾ 可折叠左侧代码块；点节点后的 ◎ 可在下方逐级查看。右上角「缩略图导航」显示当前视图在整页中的位置，可点击/拖动定位。</div>';
      currentData = undefined;
      if (graphMode) graphView.innerHTML = '<div class="placeholder">JSON 为空，暂无可展示的关系图。</div>';
      renderNav();
      refreshMinimap();
      updatePanels();
      return;
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      const info = parseError(e, text);
      setBadge(leftBadge, "格式错误", "err");
      setBadge(rightBadge, "—", "");

      let locText = "";
      if (info.pos != null && text.length > 0) {
        let p = info.pos;
        if (p >= text.length) p = text.length - 1;
        const lc = charToPos(text, p);
        locText = "\n位置：第 " + (lc.line + 1) + " 行，第 " + (lc.ch + 1) + " 列";
        const mark = editor.markText(
          { line: lc.line, ch: lc.ch },
          { line: lc.line, ch: lc.ch + 1 },
          { className: "cm-error" }
        );
        errorMarks.push(mark);
        editor.setCursor({ line: lc.line, ch: lc.ch });
      }
      errBox.textContent = "✗ JSON 解析失败：" + info.msg + locText;
      errBox.classList.add("show");
      output.innerHTML = '<div class="placeholder">JSON 存在错误，已在左侧用红色标出，请修正后重试。</div>';
      currentData = undefined;
      if (graphMode) graphView.innerHTML = '<div class="placeholder">JSON 解析失败，暂无可展示的关系图。</div>';
      renderNav();
      refreshMinimap();
      updatePanels();
      return;
    }

    currentData = data;
    setBadge(leftBadge, "解析成功", "ok");
    setBadge(rightBadge, typeName(data), "ok");
    renderMain(data);
    openInNavigator(data, "根");
    updatePanels();
    if (searchBox.value.trim()) runSearch(searchBox.value); else clearSearch();
  }

  /* ---------- drag to pan (output, both axes) ---------- */
  let justDragged = false;
  function enableDragScroll(elem) {
    let down = false, moved = false, startX = 0, startY = 0, sl = 0, st = 0;
    elem.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      down = true; moved = false; startX = e.clientX; startY = e.clientY; sl = elem.scrollLeft; st = elem.scrollTop;
    });
    elem.addEventListener("pointermove", function (e) {
      if (!down) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        moved = true;
        elem.classList.add("dragging");
        if (e.cancelable) e.preventDefault(); // avoid selecting text while panning
        elem.scrollLeft = sl - dx;            // horizontal pan
        elem.scrollTop = st - dy;             // vertical pan
      }
    });
    const end = function () {
      if (down && moved) justDragged = true;  // swallow the click that follows a drag
      down = false; moved = false; elem.classList.remove("dragging");
    };
    elem.addEventListener("pointerup", end);
    elem.addEventListener("pointercancel", end);
    // capture-phase: suppress the accidental click after a pan
    elem.addEventListener("click", function (e) {
      if (justDragged) { justDragged = false; e.stopPropagation(); e.preventDefault(); }
    }, true);
  }
  enableDragScroll(output);

  /* ---------- minimap / viewport navigation ---------- */
  const mapWin = document.getElementById("mapWin");
  const mapMini = document.getElementById("mapMini");
  const mapThumb = document.getElementById("mapThumb");

  function getMainView() { return graphMode ? graphView : output; }

  // 当前可见节点的「实际内容边界」（含拖拽偏移），用于让缩略图高亮框与 JSON 真实大小一致
  function getGraphContentBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    if (graphRoot) {
      (function collect(n, hidden) {
        if (hidden) return;
        const x = n.x + (n.userDX || 0), y = n.y + (n.userDY || 0);
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x + n.w > maxX) maxX = x + n.w;
        if (y + n.h > maxY) maxY = y + n.h;
        n.children.forEach(function (c) { collect(c, c.parentEdge && collapsed.has(c.parentEdge.key)); });
      })(graphRoot, false);
    }
    if (minX === Infinity) { minX = 0; minY = 0; maxX = worldW || 1; maxY = worldH || 1; }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
  }

  /* 缩略图坐标系：把「画布世界坐标」线性映射到缩略图整块区域内（铺满），
     —— 高亮框的定位与点击跳转共用同一套映射，保证两者始终一致 */
  function miniWorldParams() {
    const miniW = mapMini.clientWidth, miniH = mapMini.clientHeight;
    const cb = getGraphContentBounds();
    if (cb.w <= 0 || cb.h <= 0 || miniW <= 0 || miniH <= 0) return null;
    return { miniW: miniW, miniH: miniH, cb: cb, sx: miniW / cb.w, sy: miniH / cb.h };
  }
  function worldToMiniX(wx, p) { return (wx - p.cb.minX) * p.sx; }
  function worldToMiniY(wy, p) { return (wy - p.cb.minY) * p.sy; }
  function miniToWorldX(mx, p) { return p.cb.minX + mx / p.sx; }
  function miniToWorldY(my, p) { return p.cb.minY + my / p.sy; }

  function updateMinimapThumb() {
    const miniH = mapMini.clientHeight, miniW = mapMini.clientWidth;
    if (currentData === undefined || miniH <= 0) {
      mapThumb.style.left = "4px"; mapThumb.style.right = "4px"; mapThumb.style.width = "auto";
      mapThumb.style.top = "0px"; mapThumb.style.height = miniH + "px";
      mapWin.title = "缩略图导航：尚未解析"; return;
    }
    if (graphMode) {
      const cw = graphView.clientWidth, ch = graphView.clientHeight;
      const p = miniWorldParams();
      if (!p || cw <= 0 || ch <= 0) {
        mapThumb.style.left = "4px"; mapThumb.style.right = "4px"; mapThumb.style.width = "auto";
        mapThumb.style.top = "0px"; mapThumb.style.height = miniH + "px";
        mapWin.title = "缩略图导航：完整显示"; return;
      }
      const vw = cw / graphScale, vh = ch / graphScale;
      const vLeft = -panX / graphScale, vTop = -panY / graphScale;
      // 以「当前 JSON 实际内容边界」为缩略图世界范围，使高亮框大小与数据一致
      let tw = vw * p.sx, th = vh * p.sy;
      let tx = worldToMiniX(vLeft, p), ty = worldToMiniY(vTop, p);
      tw = Math.max(6, Math.min(tw, miniW));
      th = Math.max(6, Math.min(th, miniH));
      tx = Math.max(0, Math.min(tx, miniW - tw));
      ty = Math.max(0, Math.min(ty, miniH - th));
      mapThumb.style.right = "auto"; mapThumb.style.left = tx + "px"; mapThumb.style.width = tw + "px";
      mapThumb.style.top = ty + "px"; mapThumb.style.height = th + "px";
      const pctX = Math.round((vLeft / p.cb.w) * 100), pctY = Math.round((vTop / p.cb.h) * 100);
      mapWin.title = "缩略图导航：视图 X " + pctX + "% · Y " + pctY + "% · 缩放 " + Math.round(graphScale * 100) + "%";
    } else {
      const mv = output, sh = mv.scrollHeight, ch = mv.clientHeight;
      if (sh <= ch || sh <= 0) {
        mapThumb.style.left = "4px"; mapThumb.style.right = "4px"; mapThumb.style.width = "auto";
        mapThumb.style.top = "0px"; mapThumb.style.height = miniH + "px";
        mapWin.title = "缩略图导航：完整显示"; return;
      }
      const ratio = ch / sh, thumbH = Math.max(20, ratio * miniH);
      const maxTop = miniH - thumbH, top = (mv.scrollTop / (sh - ch)) * maxTop;
      mapThumb.style.right = "auto"; mapThumb.style.left = "4px"; mapThumb.style.width = "auto";
      mapThumb.style.top = top + "px"; mapThumb.style.height = thumbH + "px";
      const pctShown = Math.round(ratio * 100), posPct = Math.round(mv.scrollTop / (sh - ch) * 100);
      mapWin.title = "缩略图导航：显示 " + pctShown + "% · 位置 " + posPct + "%";
    }
  }

  function refreshMinimap() { updateMinimapThumb(); }

  function updatePanels() {
    const hasData = (currentData !== undefined);
    // 「当前元素」只在选中节点 / 字段后出现（× 关闭后同样隐藏，点画布节点重新打开；
    //   列表模式不受「未选中」限制）。缩略图导航独立于此面板，有数据即显示。
    const noSel = hasData && (selPanelClosed || (graphMode && !graphSelectedId));
    selPanel.classList.toggle("hidden", !hasData || noSel);
    mapWin.style.display = (hasData && mapUserOpen) ? "" : "none";
    selPanel.style.height = selPanelH ? selPanelH + "px" : "";
    if (hasData && mapUserOpen) refreshMinimap();
  }

  // 「–」收起 / 「+」展开：只切类，高度交给内联样式（.min 用 !important 覆盖，展开即还原）
  function setPanelMin(on) {
    if (on === selPanelMin) return;
    selPanelMin = on;
    selPanel.classList.toggle("min", on);
    if (btnSelMin) {
      btnSelMin.textContent = on ? "+" : "–";
      btnSelMin.title = on ? "展开面板" : "收起面板";
      btnSelMin.setAttribute("aria-label", btnSelMin.title);
    }
  }

  // 面板头暂时注释掉（selHead），按钮元素不存在 -> 全部判空，恢复 selHead 后无需改这里
  if (btnSelMin) btnSelMin.addEventListener("click", function () {
    setPanelMin(!selPanelMin);
    updatePanels();
    if (!selPanelMin) refreshMinimap();
  });
  if (btnSelClose) btnSelClose.addEventListener("click", function () {
    selPanelClosed = true;
    updatePanels();
  });

  let miniRebuildTimer = null;
  function scheduleMinimapRebuild() {
    clearTimeout(miniRebuildTimer);
    miniRebuildTimer = setTimeout(refreshMinimap, 160);
  }
  output.addEventListener("click", scheduleMinimapRebuild);
  output.addEventListener("scroll", updateMinimapThumb);

  let mapDrag = false;
  function mapSetFromClient(clientY, clientX) {
    if (graphMode) {
      const cw = graphView.clientWidth, ch = graphView.clientHeight;
      const p = miniWorldParams();
      const rect = mapMini.getBoundingClientRect();
      if (!p || cw <= 0 || ch <= 0) return;
      let mx = clientX - rect.left, my = clientY - rect.top;
      mx = Math.max(0, Math.min(rect.width, mx));
      my = Math.max(0, Math.min(rect.height, my));
      const wx = miniToWorldX(mx, p), wy = miniToWorldY(my, p);
      panX = cw / 2 - wx * graphScale;
      panY = ch / 2 - wy * graphScale;
      applyGraphTransform();
    } else {
      const mv = output, sh = mv.scrollHeight, ch = mv.clientHeight;
      if (sh <= ch) return;
      const rect = mapMini.getBoundingClientRect();
      const miniH = rect.height;
      const ratio = ch / sh, thumbH = ratio * miniH;
      let top = clientY - rect.top - thumbH / 2;
      top = Math.max(0, Math.min(top, miniH - thumbH));
      mv.scrollTop = (top / (miniH - thumbH)) * (sh - ch);
      updateMinimapThumb();
    }
  }
  mapMini.addEventListener("pointerdown", function (e) {
    mapDrag = true;
    try { mapMini.setPointerCapture(e.pointerId); } catch (err) {}
    mapSetFromClient(e.clientY, e.clientX);
  });
  mapMini.addEventListener("pointermove", function (e) {
    if (!mapDrag) return;
    mapSetFromClient(e.clientY, e.clientX);
  });
  function mapDragEnd() { mapDrag = false; }
  mapMini.addEventListener("pointerup", mapDragEnd);
  mapMini.addEventListener("pointercancel", mapDragEnd);

  // (minimap is now a fixed column inside the bottom panel; header drag removed)

  document.getElementById("btn-style").addEventListener("click", function () {
    mapUserOpen = !mapUserOpen;
    updatePanels();
  });
  // 列表 / 关系图 模式切换
  const btnModeList = document.getElementById("btnModeList");
  const btnModeGraph = document.getElementById("btnModeGraph");
  function setMode(g) {
    clearEditorHighlight();
    graphMode = g;
    rightPane.classList.toggle("mode-graph", g);
    btnModeList.classList.toggle("active", !g);
    btnModeGraph.classList.toggle("active", g);

  function stripQuotes(s) {

    protect(/`[^`]*`/g);

    // 规范化空白
    s = s.replace(/\s+/g, " ").trim();

    // 在主要子句前换行（长的先匹配）
    const breaks = [
      "SELECT", "FROM", "WHERE", "ORDER BY", "GROUP BY", "HAVING",
      "LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "OUTER JOIN", "FULL JOIN", "JOIN",
      "UNION ALL", "UNION", "INSERT INTO", "INSERT", "INTO", "VALUES",
      "UPDATE", "SET", "DELETE FROM", "DELETE", "LIMIT", "OFFSET"
    ];
    breaks.sort(function (a, b) { return b.length - a.length; });
    breaks.forEach(function (kw) {
      const re = new RegExp("\\b" + kw.replace(/ /g, "\\s+") + "\\b", "gi");
      s = s.replace(re, "\n" + kw.toUpperCase());
    });

    // SELECT / FROM 列表里的逗号后换行（简单启发式）
    s = s.replace(/, ([a-zA-Z0-9_`\*]+)/g, ",\n__CONT__$1");

    // 还原受保护内容
    s = s.replace(/__P(\d+)__/g, function (_, i) { return protectedChunks[+i]; });

    // 按括号深度缩进；逗号续行多缩进两级
    const lines = s.split("\n");
    const out = [];
    let depth = 0;
    lines.forEach(function (rawLine) {
      let line = rawLine.trim();
      if (!line) return;
      let isCont = false;
      if (line.indexOf("__CONT__") === 0) { isCont = true; line = line.slice(8); }
      if (line.charAt(0) === ")") depth = Math.max(0, depth - 1);
      out.push("  ".repeat(depth + (isCont ? 2 : 0)) + line);
      const open = (line.match(/\(/g) || []).length;
      const close = (line.match(/\)/g) || []).length;
      depth += open - close;
      if (depth < 0) depth = 0;
    });
    return out.join("\n");
  }
  function showSQLOutput(text) {
    sqlOutput.classList.add("has-result");
    sqlViewer.setValue(text);
    sqlViewer.clearHistory();
    sqlViewer.setCursor({ line: 0, ch: 0 });
    sqlViewer.refresh();
    sqlInputStats.textContent = computeStats(editor.getValue());
    sqlOutputStats.textContent = computeStats(text);
  }
  function clearSQLOutput() {
    sqlOutput.classList.remove("has-result");
    sqlViewer.setValue("");
    sqlViewer.clearHistory();
    sqlInputStats.textContent = "";
    sqlOutputStats.textContent = "";
  }
  function runSQLParse() {
    showSQLOutput(extractSQLStatements(editor.getValue(), sqlSource.value).join("\n;\n"));
  }
  function runSQLFormat() {
    showSQLOutput(formatSQL(editor.getValue(), sqlSource.value));
  }
  function runSQLCompress() {
    showSQLOutput(compressSQL(editor.getValue(), sqlSource.value));
  }

  function setAppMode(mode) {
    if (mode !== "json" && mode !== "sql") return;
    appMode = mode;
    document.body.classList.toggle("mode-sql", mode === "sql");
    appModeTabs.querySelectorAll(".app-tab").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-mode") === mode);
    });
    // SQL 模式下输入框取消语法高亮（纯文本），格式化结果仍由 sqlViewer 保留 mysql 高亮
    editor.setOption("mode", mode === "json" ? { name: "javascript", json: true } : null);
    if (mode === "json") {
      doProcess();
    } else {
      clearErrorMarks();
      errBox.classList.remove("show");
      clearSQLOutput();
      // 切到 SQL 模式后容器才可见，需重算只读视图尺寸
      setTimeout(function () { sqlViewer.refresh(); }, 0);
    }
  }

  function cmdUnescape() {
    const text = editor.getValue().trim();
    if (!text) return;
    let first; try { first = JSON.parse(text); } catch (e) { doProcess(); return; }
    if (typeof first === "string") {
      // whole input was a JSON string (double-encoded) -> decode one layer
      try {
        const second = JSON.parse(first);
        editor.setValue(JSON.stringify(second, null, 2));
      } catch (e2) {
        editor.setValue(first); // plain decoded string
      }
    } else {
      leftBadge.textContent = "无需去转义";
    }
  }
  cmdSelect.addEventListener("change", function () {
    const v = cmdSelect.value;
    cmdSelect.value = "";
    if (!v) return;
    if (v === "format") cmdFormat();
    else if (v === "minify") cmdMinify();
    else if (v === "compact") cmdCompact();
    else if (v === "unescape") cmdUnescape();
    else if (v === "sort") {
      openSortModal();
    }
  });

  if (btnNavBack) btnNavBack.addEventListener("click", function () { navGo(-1); });
  if (btnNavFwd) btnNavFwd.addEventListener("click", function () { navGo(1); });

  /* ---------- events ---------- */
  editor.on("change", function () {
    process();
    scheduleHistorySnapshot();
  });

  btnEscape.addEventListener("click", function () {
    showEscaped = !showEscaped;
    btnEscape.textContent = "转义: " + (showEscaped ? "开" : "关");
    btnEscape.classList.toggle("on", showEscaped);
    if (currentData !== undefined) { renderTree(currentData); openInNavigator(navContext, navRootLabel); }
  });

  document.getElementById("btn-sample").addEventListener("click", function () {
    editor.setValue(JSON.stringify(SAMPLE, null, 2));
  });
  document.getElementById("btn-format").addEventListener("click", function () {
    const text = editor.getValue().trim();
    if (!text) return;
    try {
      const d = JSON.parse(text);
      editor.setValue(JSON.stringify(d, null, 2));
    } catch (e) {
      doProcess();
    }
  });
  /* ---------- 粘贴后自动格式化（json 模式） ----------
     粘贴落定后尝试解析，能解析且当前不是 2 空格缩进格式时才 setValue，
     避免重复格式化造成光标跳动；解析失败（如片段拼接中）则走原有防抖解析 */
  editor.getWrapperElement().addEventListener("paste", function () {
    if (appMode !== "json") return;
    setTimeout(function () {
      const text = editor.getValue();
      const t = text.trim();
      if (!t) return;
      let d; try { d = JSON.parse(t); } catch (e) { return; }
      const pretty = JSON.stringify(d, null, 2);
      if (t !== pretty) {
        const cur = editor.getCursor();
        editor.setValue(pretty);
        editor.setCursor(cur);
      }
      doProcess();
    }, 0);
  });
  document.getElementById("btn-clear").addEventListener("click", function () {
    editor.setValue("");
    editor.focus();
    if (appMode === "sql") clearSQLOutput();
  });

  appModeTabs.querySelectorAll(".app-tab").forEach(function (b) {
    b.addEventListener("click", function () { setAppMode(b.getAttribute("data-mode")); });
  });
  btnSqlParse.addEventListener("click", runSQLParse);
  btnSqlFormat.addEventListener("click", runSQLFormat);
  btnSqlCompress.addEventListener("click", runSQLCompress);
  btnSqlWrap.addEventListener("click", function () {
    const on = !sqlViewer.getOption("lineWrapping");
    sqlViewer.setOption("lineWrapping", on);
    btnSqlWrap.classList.toggle("on", on);
    sqlViewer.refresh();
  });
  sqlSource.addEventListener("change", function () {
    if (appMode !== "sql") return;
    clearSQLOutput();
    // 切换来源后自动重跑一次，避免用户再点一次按钮
    runSQLFormat();
  });

  document.getElementById("btn-history").addEventListener("click", openHistoryModal);
  document.getElementById("historyCancel").addEventListener("click", closeHistoryModal);
  document.getElementById("historyClear").addEventListener("click", clearHistory);
  let historyMaskArmed = false;
  historyMask.addEventListener("pointerdown", function (e) { historyMaskArmed = (e.target === historyMask); });
  historyMask.addEventListener("click", function (e) {
    if (historyMaskArmed && e.target === historyMask) closeHistoryModal();
    historyMaskArmed = false;
  });

  window.addEventListener("resize", function () {
    if (graphMode && graphSvg) {
      graphSvg.setAttribute("width", graphView.clientWidth);
      graphSvg.setAttribute("height", graphView.clientHeight);
    }
    refreshMinimap();
  });

  // initial
  setMode(true);
  doProcess();
})();
</script>
</body>
</html>
